# =============================================================================
# 二年级快乐学习台 · 一键部署（内网 / 任何装了 Docker 的机器）
# -----------------------------------------------------------------------------
# 默认用 SQLite，单文件、零运维，不需要 MySQL。
#
# 起服务：
#   cd deploy
#   cp .env.example .env      # 填 LLM_API_KEY（判卷需要能看图的模型，见 .env.example）
#   docker compose up -d --build
#
# 看日志：
#   docker compose logs -f app
#
# 停服务（数据保留在卷里）：
#   docker compose down
#
# 浏览器访问：http://<服务器内网IP>:8788
#
# ⚠️ app 用的是 **host 网络**（见下面 network_mode 的说明），不是 bridge。这一条
#    直接决定「家里免不免口令、家长后台能不能用」，别随手改回 bridge。
#
# 想让平板「添加到主屏幕」后没有浏览器地址栏 / 底栏（装成独立应用）：
#   1. 生成证书（mkcert 自签），放成 server/certs/{cert.pem,key.pem,rootCA.crt}
#      · 这台机器是 Windows、且服务就跑在它上面 → 仓库根跑 scripts/https-setup.ps1
#      · 服务跑在 NAS / Linux 上 → 跑不了 .ps1（PowerShell + winget），两条路：
#        a) 在该主机上装 mkcert 直接签；
#        b) 在 Windows 上签，但**必须把该主机的内网 IP 写进 SAN**：
#           mkcert -cert-file cert.pem -key-file key.pem <NAS的IP> localhost 127.0.0.1
#           再把三件套（含 mkcert -CAROOT 里的 rootCA.pem → 改名 rootCA.crt）拷过去。
#      ⚠️ 签的是「谁的内网 IP」，平板打开的就必须是那个 IP —— 签错机器 = 还是提示不安全。
#      ⚠️ rootCA.crt 千万不能漏：/api/diag/rootca.crt 是在 cert.pem **同目录**找它
#         （不是去 mkcert 的 CAROOT 找），少了它平板就下不到根证书。
#   2. 把 deploy/.env 里的 HTTPS_ENABLED 改成 true（证书目录已默认挂好，不用再动 compose）
#   3. docker compose up -d          # 只改了 .env 不用 --build
# 注意：开了 HTTPS 之后访问地址要改成 https://<服务器内网IP>:8788，
#       并且平板必须先装一次根证书（先下载 http://<IP>:8788/api/diag/rootca.crt，再开 HTTPS）。
#
# 英文故事（孩子端「英文」页从共享目录随机抽视频播）：
#   容器看不到宿主机上的路径，**必须**把挂着视频的那个宿主机目录填进 .env：
#     VIDEO_DIR_HOST=/vol02/1000-0-bfb475f2        # 例：fnOS 上挂好的共享挂载点
#   改完 docker compose up -d（不用 --build）。容器内固定挂成 /app/server/video，
#   config.yaml 的 video.dir 不用动（会被环境变量 VIDEO_DIR 覆盖）。
#
# 访问鉴权（端口要上公网就必须配，见 .env.example「访问鉴权」一节）：
#   CHILD_PIN / PARENT_PIN / AUTH_LAN_CIDRS 写在 deploy/.env 里，compose 透传进容器。
#   ⚠️ 这几个值是在 server/config/config.yaml 里被 ${CHILD_PIN} 之类**引用**的，而
#      config.yaml 是 **COPY 进镜像**的。所以：
#        · 只改 .env        → docker compose up -d
#        · 改了 config.yaml → docker compose up -d --build（不 rebuild 等于白改）
#      容器里生效的永远是镜像里那份 config.yaml；宿主机上改了不同步 / 不重建，
#      现象就是「口令明明配了却一直说不对」。启动日志会写明口令「几位、来自哪里」。
#
#   ⚠️ 用 bridge 网络时，AUTH_LAN_CIDRS 里的 IPv6 段**永远匹配不上**：公网访问走 IPv6，
#      而 Docker 默认 bridge 不做 IPv6 NAT，那半边是 userland docker-proxy 转发的，
#      容器看到的来源地址会变成 compose 网段的网关（实测 172.22.0.1）→ 家里被当成公网。
#      所以这个 compose 默认用 host 网络（见 network_mode: host 那段）。
# =============================================================================

services:
  # ---------------------------------------------------------------- 应用
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: grade2-app:1.0
    container_name: grade2-app
    restart: unless-stopped
    # PID 1 信号转发：用 docker 内置的 docker-init（就是 tini，随 Docker 自带，零下载）。
    # 作用：node 收得到 SIGTERM，docker compose stop / down 时秒退，不用干等 10 秒。
    # 以前是镜像里 apt 装 tini —— 国内访问 debian 源每次构建白等 100 秒+，已去掉。
    init: true
    # ---------------------------------------------------------------- 网络
    # **必须用 host 网络**。不是为了省事，而是 bridge 模式下鉴权判不出「家里」：
    #   · 公网访问走 IPv6（域名只有 AAAA），而 Docker 默认 bridge **不做 IPv6 NAT**，
    #     IPv6 那半边由 userland 的 docker-proxy 转发 —— 容器看到的来源地址会变成
    #     **本 compose 网段的网关**（实测 172.22.0.1），真实客户端 IP 直接丢了；
    #   · 于是 AUTH_LAN_CIDRS 里那个 IPv6 /64 永远匹配不上，家里也被当成公网：
    #     孩子端每次要输口令，家长后台 /api/admin/* 全部 403（就是「接口没反应」），
    #     而家长口令在「公网」是直接拒登的 → 家里根本进不去管理页。
    #   · host 模式下 IPv6 直达容器、来源地址保留 → 家里免口令、管理页正常；
    #     公网仍然要孩子口令、家长接口仍 403（判定看的是地址，跟网络模式无关）。
    # 代价：没有端口映射了 —— APP_PORT 就是实际访问端口（下面 environment 里那行）；
    #       host 模式下也不能同时写 ports（两者冲突，Docker 会直接报错）。
    network_mode: host
    environment:
      # —— 数据库：固定 sqlite，单文件落在 app-data 卷里，无需任何数据库服务 ——
      DB_DRIVER: sqlite
      # —— 端口：host 网络下这一项就是**实际对外端口**（没有「映射」这一层了）——
      # 服务端自己读 APP_PORT 决定监听地址，所以改 .env 的 APP_PORT = 换访问端口。
      # ⚠️ 别再像以前那样「容器内钉死 8788、靠 ports 映射外部端口」——host 模式下
      #    没有 ports 可用，.env 里写了 9000 而这里钉着 8788，就会出现
      #    「页面打不开，容器日志显示在听 8788」这种对不上的情况。
      APP_PORT: ${APP_PORT:-8788}
      # —— 大模型（全部透传，.env 里写了哪个就生效哪个）——
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 里设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_STORY_MODEL: ${LLM_STORY_MODEL:-}
      LLM_STORY_BASE_URL: ${LLM_STORY_BASE_URL:-}
      LLM_STORY_API_KEY: ${LLM_STORY_API_KEY:-}
      LLM_MARK_MODEL: ${LLM_MARK_MODEL:-}
      LLM_MARK_BASE_URL: ${LLM_MARK_BASE_URL:-}
      LLM_MARK_API_KEY: ${LLM_MARK_API_KEY:-}
      LLM_SUGGEST_MODEL: ${LLM_SUGGEST_MODEL:-}
      LLM_SUGGEST_BASE_URL: ${LLM_SUGGEST_BASE_URL:-}
      LLM_SUGGEST_API_KEY: ${LLM_SUGGEST_API_KEY:-}
      # —— 其它 ——
      # HTTPS：默认关（内网 HTTP 也能用，只是平板装不成应用）。开了要配 certs 挂载，见文件头
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      # —— 访问鉴权（端口一旦上公网就必须开，见文件头「外网访问」一节）——
      # 口令别写进这里，放 .env（.env 不进 git）。留空则用 config.yaml 里的默认值 ——
      # 而那个默认值是写在仓库里的，上公网前务必换成自己的。
      CHILD_PIN: ${CHILD_PIN:-}
      PARENT_PIN: ${PARENT_PIN:-}
      # ⚠️ Docker 下这一项**必须填**，否则容器里分不清「家里」和「公网」
      #    （来源地址恒为网桥网关），结果是家里每次打开也要输口令。
      #    逗号分隔，IPv4 和家里那个 IPv6 /64 都要写。
      #    例：AUTH_LAN_CIDRS=172.10.10.0/24,2408:8352:a13:2cb1::/64
      AUTH_LAN_CIDRS: ${AUTH_LAN_CIDRS:-}
      TZ: Asia/Shanghai
      # 英文故事视频目录：**容器内**路径，固定挂在 /app/server/video（见下面 volumes）。
      # 宿主机上的真实路径由 .env 的 VIDEO_DIR_HOST 决定 —— 所以 config.yaml 里的
      # video.dir 默认值（UNC 路径）在 Docker 下会被这一行覆盖掉，不用去改配置。
      VIDEO_DIR: /app/server/video
    volumes:
      # 数据（数据库 / 语音缓存 / 备份）与日志，务必映射出来
      - app-data:/app/server/data
      - app-logs:/app/server/logs
      # deploy/ 整个目录（只读）：**为了容器自己能读到 deploy/.env**。
      # 镜像里没有 deploy/，所以服务端启动时找不到 .env（日志会写
      # 「没有可用的 .env，查找过=/app/server/.env、/app/.env、/app/deploy/.env」），
      # 只能靠 compose 的 ${...} 插值把变量传进去 —— 而部分 NAS 的 Docker 面板
      # 并不在仓库目录里跑 compose，插值拿不到 .env，口令 / AUTH_LAN_CIDRS 就全落空，
      # 表现是「口令明明配了却说不对」。
      # 挂进来之后 /app/deploy/.env 就在服务端自己的查找路径里，两条路都通。
      # ⚠️ 已存在的环境变量优先，所以上面 environment 里写死的仍然说了算。
      - .:/app/deploy:ro
      # 证书（HTTPS 用）。默认就挂上：HTTPS_ENABLED=false 时用不到，挂个空目录也没副作用。
      # ⚠️ 起容器前先在宿主机上 mkdir -p server/certs —— 目录不存在时 Docker 会自己建一个
      #    **空目录**（Linux 上属主 root），现象是「明明拷了证书，容器里却是空的」。
      # 三件套：cert.pem / key.pem / rootCA.crt（缺 rootCA.crt 平板就下不到根证书）。
      # 容器内对应 /app/server/certs —— 正好是 config.yaml 里 certFile 的相对默认值，无需改配置。
      - ../server/certs:/app/server/certs:ro
      # 英文故事视频（**只读**）。宿主机上先把共享挂到本地，再把那个挂载点填进 .env：
      #     VIDEO_DIR_HOST=/vol02/1000-0-bfb475f2
      # 容器内固定挂到 /app/server/video（正好是上面 VIDEO_DIR 的值）。
      # ⚠️ 这一行是「容器能不能看见视频」的唯一开关。没挂进来时容器里根本没有这个路径，
      #    页面会报「目录不存在：/xxx」——而此时宿主机上明明能看到文件。
      #    NAS 上最常见的踩法：视频挂在了别的容器里，或只挂进了 fnOS 的文件管理，没挂给这个容器。
      # ⚠️ 换成新路径后不用 --build，docker compose up -d 重建容器即可生效。
      # 不填 VIDEO_DIR_HOST 时挂 ./video（空目录）→ 页面提示「还没配置视频目录」，不会报错。
      - ${VIDEO_DIR_HOST:-./video}:/app/server/video:ro
      # 想改 config.yaml 里的高级项（音色、超时等）又不想重建镜像：
      #   1) cp ../server/config/config.yaml ./config.yaml
      #   2) 去掉下面这行的注释
      #   3) docker compose restart app
      # 数据库地址、密钥这类常用项用 .env 就够了，不用动这个文件。
      # - ./config.yaml:/app/server/config/config.yaml:ro
    healthcheck:
      # 开了 HTTPS 之后服务**只监听 https**（http / https 二选一，不是双监听），
      # 所以健康检查必须跟着换协议，否则容器永远 unhealthy（应用本身是好的，纯误报）。
      # 证书是自签的 → rejectUnauthorized:false；只探本机回环，不涉及外部。
      # 端口取 APP_PORT（host 网络下它可能被 .env 改过），别再写死 8788。
      test:
        - CMD
        - node
        - -e
        - "const s=process.env.HTTPS_ENABLED==='true';const m=s?require('https'):require('http');const r=m.request({host:'127.0.0.1',port:Number(process.env.APP_PORT||8788),path:'/api/health',rejectUnauthorized:false},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.end();"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------- 可选：nginx 反向代理
  # 后端自己就能托前端，所以 nginx 只有两个理由才需要：
  #   1. 想上 HTTPS
  #   2. 想给域名 / 固定端口做统一入口
  # 要用就 docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    container_name: grade2-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - app
    # app 在 host 网络上 → 它不在本 compose 的网桥里，服务名 `app` **解析不到**。
    # 所以 nginx 走宿主机的 8788（也就是 app 实际监听的端口），
    # nginx.conf 里的 upstream 已相应改成 host.docker.internal:8788。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  app-data:
  app-logs:
