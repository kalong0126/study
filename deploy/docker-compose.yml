# =============================================================================
# 二年级快乐学习台 · 一键部署（Ubuntu / 任何装了 Docker 的机器）
# -----------------------------------------------------------------------------
# 起服务：
#   cd deploy
#   cp .env.example .env      # 填 LLM_API_KEY，按需改 DB_PASSWORD
#   docker compose up -d --build
#
# 看日志：
#   docker compose logs -f app
#
# 停服务（数据保留在卷里）：
#   docker compose down
# =============================================================================

services:
  # ---------------------------------------------------------------- MySQL
  # 不想装 MySQL 就把下面整段删掉，并把 .env 里的 DB_DRIVER 改成 sqlite
  db:
    image: mysql:8.4
    container_name: grade2-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-grade2}
      MYSQL_USER: ${DB_USER:-grade2}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # 家里不需要从外网连数据库，只暴露给宿主机调试时可打开
    # ports:
    #   - "127.0.0.1:3306:3306"

  # ---------------------------------------------------------------- 应用
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: grade2-app:1.0
    container_name: grade2-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # —— 数据库 ——
      # DB_DRIVER=sqlite 时下面几项都不用管
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-grade2}
      DB_USER: ${DB_USER:-grade2}
      DB_PASSWORD: ${DB_PASSWORD}
      # —— 大模型 ——
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 里设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # —— 其它 ——
      TZ: Asia/Shanghai
    ports:
      # 只绑内网网段也行，例如 "192.168.1.10:8788:8788"
      - "${APP_PORT:-8788}:8788"
    volumes:
      # 数据（数据库 / 语音缓存 / 备份）与日志，务必映射出来
      - app-data:/app/server/data
      - app-logs:/app/server/logs
      # 想改 config.yaml 里的高级项（模型名、音色、超时）又不想重建镜像：
      #   1) cp ../server/config/config.yaml ./config.yaml
      #   2) 去掉下面这行的注释
      #   3) docker compose restart app
      # 数据库地址、密钥这类常用项用 .env 就够了，不用动这个文件。
      # - ./config.yaml:/app/server/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------- 可选：nginx 反向代理
  # 后端自己就能托前端，所以 nginx 只有两个理由才需要：
  #   1. 想上 HTTPS（家里内网基本用不上）
  #   2. 想给域名 / 固定端口做统一入口
  # 要用就 docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    container_name: grade2-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  app-data:
  app-logs:
