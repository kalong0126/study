# =============================================================================
# 可选：nginx 反向代理
# -----------------------------------------------------------------------------
# 后端自己就能托管前端，所以这份配置只有在下面两种情况才需要：
#   1. 想给一个固定域名 / 端口做统一入口
#   2. 想上 HTTPS（把下面注释掉的证书段打开）
# 启用：docker compose --profile proxy up -d
# =============================================================================

upstream grade2_app {
    # app 容器用的是 host 网络 → 它不在 compose 网桥上，服务名 `app` 解析不到，
    # 只能走宿主机端口。host.docker.internal 由 compose 的 extra_hosts: host-gateway 提供。
    server host.docker.internal:8788;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 前端产物不大，但首屏别让它反复下载
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 12m;   # 听写判卷要上传拼图，给足余量

    # 静态资源（带 hash 的文件名）可以长缓存
    location /assets/ {
        proxy_pass http://grade2_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 接口：不能缓存，且超时要放宽（故事生成 / 判卷是慢接口）
    location /api/ {
        proxy_pass http://grade2_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;   # 诊断日志是流式的，别攒着
    }

    # 其余交给后端（SPA 的 history 路由由后端兜底到 index.html）
    location / {
        proxy_pass http://grade2_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ---------------------------------------------------------------- HTTPS（可选）
    # 先想清楚要不要用 nginx 做 TLS：
    #   · 只是想让平板把网页装成应用（去掉地址栏/底栏）→ **不需要 nginx**，
    #     直接让 app 自己讲 HTTPS 更省一层：设 HTTPS_ENABLED=true + 挂载 server/certs。
    #   · 想同时要域名入口 / 多站点 / 统一证书管理 → 才用下面这段。
    # 开启方式：去掉注释，证书放 deploy/certs/ 并在 docker-compose 里挂进这个容器。
    #
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/cert.pem;
    # ssl_certificate_key /etc/nginx/certs/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    #
    # 开了 443 之后一般还把 80 跳过去（放在这个 server 块里）：
    #   server { listen 80; server_name _; return 301 https://$host$request_uri; }
}
