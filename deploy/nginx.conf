# =============================================================================
# 可选：nginx 反向代理
# -----------------------------------------------------------------------------
# 后端自己就能托管前端，所以这份配置只有在下面两种情况才需要：
#   1. 想给一个固定域名 / 端口做统一入口
#   2. 想上 HTTPS（把下面注释掉的证书段打开）
# 启用：docker compose --profile proxy up -d
# =============================================================================

upstream grade2_app {
    server app:8788;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 前端产物不大，但首屏别让它反复下载
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 12m;   # 听写判卷要上传拼图，给足余量

    # 静态资源（带 hash 的文件名）可以长缓存
    location /assets/ {
        proxy_pass http://grade2_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 接口：不能缓存，且超时要放宽（故事生成 / 判卷是慢接口）
    location /api/ {
        proxy_pass http://grade2_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;   # 诊断日志是流式的，别攒着
    }

    # 其余交给后端（SPA 的 history 路由由后端兜底到 index.html）
    location / {
        proxy_pass http://grade2_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ---------------------------------------------------------------- HTTPS（可选）
    # 家里内网一般用不上；要用就申请好证书再打开。
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
