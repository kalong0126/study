# ============================================================================
# 二年级快乐学习台 · 后端配置
# ----------------------------------------------------------------------------
# 说明：
#   1. 带 ${XXX} 的值会从环境变量注入，便于密钥不进 git。
#   2. 改完配置需要重启服务（npm run dev 会自动重启）。
#   3. 密钥只会出现在后端日志的脱敏位置，永远不会下发给前端。
# ============================================================================

server:
  # 浏览器访问端口。可用环境变量 APP_PORT 覆盖（.env 里改就行）
  port: ${APP_PORT:-8788}
  host: 0.0.0.0
  # 允许的前端来源。留空数组 = 允许所有（家庭内网用）。
  # 想收紧就填，例如 ["http://192.168.1.10:8080"]
  corsOrigins: []

  # --------------------------------------------------------------------------
  # HTTPS（想让平板「装到桌面后没有浏览器地址栏 / 底栏」就必须开）
  # --------------------------------------------------------------------------
  # 为什么需要：安卓 Chrome 只在**安全上下文**（https:// 或 http://localhost）里才
  #   1) 允许注册 Service Worker
  #   2) 把网页装成应用（WebAPK，独立窗口）
  # 内网 HTTP 下这两件都做不到，「添加到主屏幕」只会退化成普通书签，地址栏和底栏都还在。
  #
  # 证书怎么来：在仓库根目录跑 scripts/https-setup.ps1（用 mkcert 自签，
  # 它会把本机所有内网 IP 都签进 SAN，换 IP 不用重签），然后在平板上装一次根证书。
  #
  # 证书文件不存在时**不会导致启动失败**：只回退 HTTP 并在启动日志里给出警告。
  https:
    enabled: ${HTTPS_ENABLED:-false}
    # 相对路径按 server/ 解析。默认就是 https-setup.ps1 落盘的位置
    certFile: ./certs/cert.pem
    keyFile: ./certs/key.pem

  auth:
    # 内网部署默认关闭。将来若要暴露公网，改成 true 并设置两个 PIN。
    enabled: true
    childPin: "1234"
    parentPin: "8888"
    sessionDays: 30

# ---------------------------------------------------------------------------
# 数据库
# ---------------------------------------------------------------------------
db:
  # sqlite：单文件、零运维，开箱即用（家庭内网推荐）
  # mysql ：需要先起 MySQL，见 deploy/docker-compose.yml
  # 也可用环境变量覆盖：DB_DRIVER / DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
  driver: ${DB_DRIVER:-sqlite}

  sqlite:
    file: ./data/grade2.db

  mysql:
    host: ${DB_HOST:-127.0.0.1}
    port: ${DB_PORT:-3306}
    database: ${DB_NAME:-grade2}
    user: ${DB_USER:-grade2}
    password: ${DB_PASSWORD}
    connectionLimit: 10

# ---------------------------------------------------------------------------
# 大模型（OpenAI 兼容接口）
# ---------------------------------------------------------------------------
# 三个用途，各自可以指定不同的模型，甚至来自不同厂商：
#   story   → 生成童话（纯文本模型即可，越便宜越好）
#   mark    → 手写判卷（**必须支持视觉/看图**，纯文本模型会直接失败）
#   suggest → 组词候选建议（纯文本）
#
# 回落规则：某用途的 *BaseUrl / *ApiKey 留空 → 自动用下面的全局 baseUrl / apiKey。
# 所以「同一家厂商换模型」只需改模型名；「不同厂商各用各的 key」才需要单独配。
#
# 对应的环境变量（写在 .env 里更方便，不用改这个文件）：
#   LLM_BASE_URL / LLM_API_KEY
#   LLM_STORY_MODEL / LLM_STORY_BASE_URL / LLM_STORY_API_KEY
#   LLM_MARK_MODEL  / LLM_MARK_BASE_URL  / LLM_MARK_API_KEY
#   LLM_SUGGEST_MODEL / LLM_SUGGEST_BASE_URL / LLM_SUGGEST_API_KEY
# ---------------------------------------------------------------------------
llm:
  # —— 全局默认 provider：没单独配的用途都走它 ——
  baseUrl: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  apiKey: ${LLM_API_KEY}

  # —— 各用途的模型名 ——
  storyModel: ${LLM_STORY_MODEL:-deepseek-chat}
  # 可选视觉模型：qwen-vl-max / glm-4v-plus / gpt-4o / doubao-1.5-vision-pro
  markModel: ${LLM_MARK_MODEL:-qwen-vl-max}
  suggestModel: ${LLM_SUGGEST_MODEL:-deepseek-chat}

  # —— 各用途可选的独立 provider（留空 = 回落到全局）——
  storyBaseUrl: ${LLM_STORY_BASE_URL:-}
  storyApiKey: ${LLM_STORY_API_KEY:-}
  markBaseUrl: ${LLM_MARK_BASE_URL:-}
  markApiKey: ${LLM_MARK_API_KEY:-}
  suggestBaseUrl: ${LLM_SUGGEST_BASE_URL:-}
  suggestApiKey: ${LLM_SUGGEST_API_KEY:-}

  timeoutMs:
    story: 60000
    mark: 90000
    suggest: 45000
  retries: 1
  temperature:
    story: 0.9
    mark: 0
    suggest: 0.5

# ---------------------------------------------------------------------------
# 文生图（语言强化「看图观察 / 看图说话」的真实配图）
# ---------------------------------------------------------------------------
# 用阿里云百炼的「千问-文生图」（qwen-image 系列）同步接口：
#   一次请求直接返回图片 URL（约 6~15 秒），我们随即把图下载到本地存起来
#   —— 厂商给的 URL 只有 24 小时有效期，绝不能直接下发给前端。
#
# apiKey 留空时自动回落 **mark（判卷）用途** 的 Key：判卷用的就是百炼，
# 同一把 Key 既能判卷又能画图，家长不用再买一份。
#
# 想关掉（不出图、退回纯文字画面描述）就把 enabled 改成 false。
# 想更省钱可换 wan2.2-t2i-flash（万相极速版，另需改 baseUrl 为异步接口）。
# ---------------------------------------------------------------------------
imagegen:
  enabled: ${IMAGEGEN_ENABLED:-true}
  model: ${IMAGEGEN_MODEL:-qwen-image-plus}
  baseUrl: ${IMAGEGEN_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
  apiKey: ${IMAGEGEN_API_KEY}
  # 输出尺寸（宽*高）。1328*1328 是千问系列的 1:1 推荐档
  size: ${IMAGEGEN_SIZE:-1328*1328}
  # 图片落盘目录（与数据库同在 data/ 下，Docker 里自动进 app-data 卷）
  dir: ./data/images
  # 出图比文本慢，给足时间（实测 6~20 秒）
  timeoutMs: ${IMAGEGEN_TIMEOUT_MS:-120000}

# ---------------------------------------------------------------------------
# 英文故事视频（内网共享上的 mp4）
# ---------------------------------------------------------------------------
# 孩子点底部「英文」→ 随机抽一集播放 → 完整看完打卡 +10 分（每天一次）。
#
# 为什么必须由后端转发：浏览器既不能读 file://，也不能直接打开 \\NAS\共享\...
# 这种 SMB 路径。所以后端把视频当普通文件读出来、按 HTTP Range(206) 一段段发给
# 浏览器，前端就是一个普通的 <video src="/api/video/stream/...">。
#
# dir 填「后端进程自己读得到的路径」，两种部署写法不同：
#   · Windows（服务直接跑在这台机器上）—— UNC 路径，例如：
#       \\172.10.10.14\156xxxx2677\PTStation\TV\guess how much i love you
#     只要「运行后端那个 Windows 账号」能在资源管理器里打开它就行。
#   · Docker（NAS / Linux）—— **别在这里填宿主机的挂载点**，容器里看不到它。
#     正确做法：把宿主机上已挂好的目录填进 deploy/.env 的 VIDEO_DIR_HOST，
#     compose 会把它挂成容器内的 /app/server/video 并用环境变量 VIDEO_DIR 覆盖本项
#     （所以下面这个默认值在 Docker 下不生效）。步骤见 docker-compose.yml 文件头。
#     ⚠️ 容器里报「目录不存在：/xxx」而宿主机上明明有文件 = 没挂进容器，不是路径写错。
#
# exts 只放浏览器**播得动**的容器：mkv / avi / rmvb 一律跳过（Chrome 不支持），
# 目录里如果全是 mkv，页面会明说「没有能播的视频」，而不是一直转圈。
#
# 目录不存在 / 共享断了都不会让服务起不来：首页给一句可读的提示，页面照常能开。
# ---------------------------------------------------------------------------
video:
  enabled: ${VIDEO_ENABLED:-true}
  dir: ${VIDEO_DIR:-\\Z2s-cg7t\共享文件\PTStation\TV\guess how much i love you}
  exts:
    - .mp4
    - .m4v
    - .webm
    - .mov
  # 目录里若有「第 1 季」这类子目录，往下扫几层（1 = 只看本层）
  maxDepth: ${VIDEO_MAX_DEPTH:-2}

# ---------------------------------------------------------------------------
# 语音合成
# ---------------------------------------------------------------------------
tts:
  # edge = 微软 Edge 朗读接口（免费）。抽象层已留好，将来可加 aliyun / tencent / local
  provider: edge
  # 童声候选：zh-CN-XiaoyiNeural(女童音) / zh-CN-YunxiNeural(男童音) / zh-CN-XiaoxiaoNeural
  voice: zh-CN-XiaoyiNeural
  # 小朋友听，语速放慢一点
  rate: "-12%"
  volume: "+0%"
  pitch: "+0Hz"
  cacheDir: ./data/tts
  cacheMaxMB: 512
  # 单次合成的文本长度上限（超过会截断，防止有人塞长文）
  maxTextLen: 300

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  level: info
  dir: ./logs
  keepDays: 14
  # 这些字段在写日志时会被替换成 [Redacted]
  redact:
    - apiKey
    - password
    - authorization
    - key

# ---------------------------------------------------------------------------
# 备份（数据搬进数据库后，备份是必需的）
# ---------------------------------------------------------------------------
backup:
  enabled: true
  # 每天凌晨 3 点
  cron: "0 3 * * *"
  dir: ./data/backup
  keepDays: 30
